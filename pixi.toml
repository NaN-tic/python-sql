[workspace]
authors = ["luqueee <luqueee_@outlook.es>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "python-sql-mojo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "python tools/build_wheel.py"
test = "python tests/run_upstream.py"
check = "twine check --strict dist/*.whl"
publish = "twine upload dist/*.whl"

[dependencies]
mojo = "==1.0.0b2"
python = "3.13.*"
hatchling = ">=1.31.0,<2"
wheel = ">=0.47.0,<0.48"
patchelf = ">=0.17.2,<0.18"
auditwheel = ">=6.7.0,<7"
twine = ">=6.2.0,<7"
