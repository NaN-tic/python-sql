[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-sql-mojo"
version = "1.8.1.1"
description = "Mojo-backed replacement for python-sql"
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
]

[tool.hatch.build.targets.wheel]
packages = ["sql"]
artifacts = [
  "sql/_core.so",
  "sql/_runtime/*.so",
]
